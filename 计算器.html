<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模拟Windows计算器</title>
    <style>
        .calculator {
            width: 300px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        #history-container {
            max-height: 150px;
            overflow-y: auto;
            margin-bottom: 10px;
            padding: 5px;
            border: 1px solid #eee;
            border-radius: 3px;
        }
        .history-item {
            padding: 5px 0;
            border-bottom: 1px dotted #eee;
            cursor: pointer;
        }
        .history-item:hover {
            background-color: #f9f9f9;
        }
        #display {
            width: 100%;
            height: 50px;
            margin-bottom: 10px;
            text-align: right;
            font-size: 24px;
            padding: 5px;
            box-sizing: border-box;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        button {
            height: 50px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #f0f0f0;
        }
        button:hover {
            background-color: #e0e0e0;
        }
        .operator {
            background-color: #ff9500;
            color: white;
        }
        .operator:hover {
            background-color: #e68a00;
        }
        .clear {
            background-color: #cccccc;
        }
        .history-btn {
            background-color: #4CAF50;
            color: white;
        }
        .history-btn:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div id="history-container"></div>
        <input type="text" id="display" readonly>
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button onclick="appendToDisplay('±')">±</button>
            <button onclick="appendToDisplay('%')">%</button>
            <button class="operator" onclick="appendToDisplay('/')">÷</button>  
            <button onclick="appendToDisplay('7')">7</button>
            <button onclick="appendToDisplay('8')">8</button>
            <button onclick="appendToDisplay('9')">9</button>
            <button class="operator" onclick="appendToDisplay('*')">×</button>   
            <button onclick="appendToDisplay('4')">4</button>
            <button onclick="appendToDisplay('5')">5</button>
            <button onclick="appendToDisplay('6')">6</button>
            <button class="operator" onclick="appendToDisplay('-')">-</button>  
            <button onclick="appendToDisplay('1')">1</button>
            <button onclick="appendToDisplay('2')">2</button>
            <button onclick="appendToDisplay('3')">3</button>
            <button class="operator" onclick="appendToDisplay('+')">+</button>
            <button onclick="appendToDisplay('0')">0</button>
            <button onclick="appendToDisplay('.')">.</button>
            <button class="history-btn" onclick="toggleHistory()">历史</button>
            <button class="operator" onclick="calculate()">=</button>
        </div>
    </div>
    <script>
        const display = document.getElementById('display');
        const historyContainer = document.getElementById('history-container');
        let history = [];
        let historyVisible = true;
        // 运算符优先级
        const precedence = {
            '+': 1,
            '-': 1,
            '*': 2,
            '/': 2
        };
        function appendToDisplay(value) {
            // 处理正负号
            if (value === '±') {
                if (display.value) {
                    display.value = display.value.startsWith('-') 
                        ? display.value.slice(1) 
                        : '-' + display.value;
                }
                return;
            }
            // 处理百分号
            if (value === '%') {
                if (display.value) {
                    display.value = (parseFloat(display.value) / 100).toString();
                }
                return;
            }
            display.value += value;
        }
        function clearDisplay() {
            display.value = '';
        }
        // 将中缀表达式转换为后缀表达式（逆波兰表达式）
        function infixToPostfix(expression) {
            const output = [];
            const operators = [];
            let numBuffer = '';
            for (let i = 0; i < expression.length; i++) {
                const char = expression[i];
                // 处理数字和小数点
                if (!isNaN(char) || char === '.') {
                    numBuffer += char;
                } 
                // 处理运算符
                else if (['+', '-', '*', '/'].includes(char)) {
                    // 处理负数（表达式开头或运算符后出现的减号）
                    if (char === '-' && (i === 0 || ['+', '-', '*', '/'].includes(expression[i-1]))) {
                        numBuffer += char;
                    } else {
                        // 先将缓冲区数字加入输出
                        if (numBuffer) {
                            output.push(parseFloat(numBuffer));
                            numBuffer = '';
                        }
                        // 弹出优先级更高或相等的运算符
                        while (operators.length && precedence[operators[operators.length-1]] >= precedence[char]) {
                            output.push(operators.pop());
                        }
                        operators.push(char);
                    }
                }
            }
            // 添加最后一个数字
            if (numBuffer) {
                output.push(parseFloat(numBuffer));
            }
            // 弹出剩余运算符
            while (operators.length) {
                output.push(operators.pop());
            }
            return output;
        }
        // 计算后缀表达式结果
        function evaluatePostfix(postfix) {
            const stack = [];
            for (const token of postfix) {
                if (typeof token === 'number') {
                    stack.push(token);
                } else {
                    const b = stack.pop();
                    const a = stack.pop();
                    let result;
                    switch (token) {
                        case '+':
                            result = a + b;
                            break;
                        case '-':
                            result = a - b;
                            break;
                        case '*':
                            result = a * b;
                            break;
                        case '/':
                            if (b === 0) throw new Error('除数不能为0');
                            result = a / b;
                            break;
                        default:
                            throw new Error('未知运算符');
                    }
                    stack.push(result);
                }
            }
            return stack[0];
        }
        function calculate() {
            try {
                let expression = display.value.replace('×', '*');
                if (!expression) return;
                const postfix = infixToPostfix(expression);
                const result = evaluatePostfix(postfix);
                // 保存到历史记录
                addToHistory(expression, result);
                // 处理结果显示（避免过多小数位）
                display.value = Number.isInteger(result) ? result : result.toFixed(6).replace(/0+$/, '').replace(/\.$/, '');
                updateHistoryDisplay();
            } catch (error) {
                display.value = '错误';
            }
        }
        function addToHistory(expression, result) {
            // 格式化表达式和结果
            const formattedExpr = expression.replace('*', '×').replace('/', '÷');
            const formattedResult = Number.isInteger(result) 
                ? result 
                : result.toFixed(6).replace(/0+$/, '').replace(/\.$/, '');
            
            history.unshift({
                expr: formattedExpr,
                result: formattedResult
            });
            // 限制历史记录数量
            if (history.length > 10) {
                history.pop();
            }
        }
        function updateHistoryDisplay() {
            if (!historyVisible) return;
            
            historyContainer.innerHTML = '';
            
            if (history.length === 0) {
                historyContainer.innerHTML = '<div class="text-center text-gray-500">暂无历史记录</div>';
                return;
            }
            history.forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `
                    <div>${item.expr} = ${item.result}</div>
                `;
                div.onclick = () => {
                    display.value = item.result;
                };
                historyContainer.appendChild(div);
            });
        }
        function toggleHistory() {
            historyVisible = !historyVisible;
            historyContainer.style.display = historyVisible ? 'block' : 'none';
        }
        // 初始化历史记录显示
        updateHistoryDisplay();
    </script>
</body>
</html>
